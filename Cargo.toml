[package]
name = "pumpkin-worker"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "A Rust Minecraft server in a Cloudflare Durable Object"
readme = "README.md"
autobins = false

[workspace]
exclude = [".work"]
resolver = "2"

[features]
test-fixtures = []

[[bin]]
name = "filesystem-probe"
path = "tests/fixtures/filesystem.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "pumpkin-do"
path = "src/main.rs"

[dependencies]
wasm-bindgen = { path = ".work/wasm-bindgen" }
js-sys = { path = ".work/wasm-bindgen/crates/js-sys" }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
pumpkin = { path = ".work/pumpkin/crates/pumpkin", default-features = false, features = ["single-threaded"] }
pumpkin-config = { path = ".work/pumpkin/crates/pumpkin-config", default-features = false }
rayon = "1.12"
worker = { path = ".work/workers-rs/worker", default-features = false }

[patch.crates-io]
js-sys = { path = ".work/wasm-bindgen/crates/js-sys" }
wasm-bindgen = { path = ".work/wasm-bindgen" }
wasm-bindgen-futures = { path = ".work/wasm-bindgen/crates/futures" }
wasm-bindgen-macro-support = { path = ".work/wasm-bindgen/crates/macro-support" }
wasm-bindgen-shared = { path = ".work/wasm-bindgen/crates/shared" }
web-sys = { path = ".work/wasm-bindgen/crates/web-sys" }
wasm-streams = { git = "https://github.com/guybedford/wasm-streams", rev = "115f0f27380a4f5fa33cbd9427a7107ec94cb557" }
libc = { path = ".work/libc" }
mio = { git = "https://github.com/guybedford/mio", rev = "a62c9e46833fc255c9217ab9aa362c6221ed4401" }
ring = { path = ".work/ring" }
tokio = { path = ".work/tokio/tokio" }
tokio-macros = { path = ".work/tokio/tokio-macros" }

[patch."https://github.com/guybedford/libc"]
libc = { path = ".work/libc" }


[profile.release]
opt-level = "s"
