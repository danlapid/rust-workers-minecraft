[build]
target = "wasm32-unknown-emscripten"
target-dir = "target/workers"

# worker-build --emscripten supplies these (and the link settings) through
# RUSTFLAGS when building with the `worker/experimental_tokio` feature; they are repeated
# here so `cargo check` sees the same cfgs.
[target.wasm32-unknown-emscripten]
rustflags = [
    "-Crelocation-model=static",
    "-Cllvm-args=-wasm-use-legacy-eh=false",
    "--cfg=tokio_unstable",
    "--cfg=wasm_bindgen_unstable_tokio",
]
