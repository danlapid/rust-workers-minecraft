name: Minecraft on WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Emscripten backend
        run: brew install emscripten
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: minecraft-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Setup pinned sources and toolchain
        run: bash scripts/setup.sh
      - name: Install Worker dependencies
        run: npm ci
      - name: Worker TCP, shared world, and SQLite restart
        run: |
          set -o pipefail
          npm test 2>&1 | tee smoke.log
          grep -q 'PUMPKIN-DO-SQLITE-RESTART-OK' smoke.log
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-log
          path: |
            smoke.log
            .data/probes/workers.*/*.log
          if-no-files-found: ignore
